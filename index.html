<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WEST 2026 GANGNEUNG MT OPS</title>
  
  <!-- Retro Design System Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif;
      background-color: #F4F2EC;
      color: #2B448C;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .retro-border {
      border-color: rgba(43, 68, 140, 0.25);
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(43, 68, 140, 0.2);
    }
  </style>
</head>
<body class="p-2 sm:p-6 flex justify-center items-start min-h-screen">

  <!-- 메인 종이 카드 컨테이너 -->
  <div class="w-full max-w-lg bg-[#FAF9F5] p-4 sm:p-5 rounded-none sm:rounded-sm shadow-md border retro-border min-h-[92vh] flex flex-col justify-between">
    
    <div>
      <!-- Header -->
      <header class="flex justify-between items-center pb-3 border-b retro-border">
        <div>
          <span class="text-xs font-bold tracking-wider text-[#C83E34]">〈 WEST 2026 GANGNEUNG MT 〉</span>
          <span class="block text-[10px] font-mono text-[#2B448C]/70">ADMIN OPERATIONS DESK</span>
        </div>
        <!-- 관리자 메뉴 버튼 (Supabase 설정창 숨김 및 관리 기능 배치) -->
        <button onclick="openAdminModal()" class="text-[11px] font-bold text-[#2B448C] hover:text-[#C83E34] border border-[#2B448C]/30 bg-white/60 px-2 py-1 flex items-center gap-1 active:scale-95">
          <i class="fa-solid fa-user-shield text-[10px]"></i> 관리자
        </button>
      </header>

      <!-- Metric Overview -->
      <section class="py-3 border-b retro-border">
        <div class="flex justify-between items-end">
          <div>
            <span class="text-[10px] font-bold tracking-widest text-[#2B448C]/70 block">CHECK-IN STATUS</span>
            <div class="flex items-baseline gap-1.5">
              <span id="checkedInCount" class="text-3xl font-black text-[#C83E34] tracking-tight">0</span>
              <span class="text-base font-bold text-[#2B448C]/60">/</span>
              <span id="totalCount" class="text-lg font-bold text-[#2B448C]">22</span>
            </div>
          </div>
          <div class="text-right">
            <span class="text-[10px] font-mono text-stone-500 block">NO PHONE NUMBERS</span>
            <span id="noPhoneCount" class="text-[11px] font-bold text-[#E06D6D] bg-[#E06D6D]/10 px-1.5 py-0.5 border border-[#E06D6D]/30 inline-block">
              0명 미등록
            </span>
          </div>
        </div>
      </section>

      <!-- Navigation Tabs -->
      <nav class="grid grid-cols-3 gap-1 my-3 bg-[#F5F4EE] p-1 border retro-border">
        <button id="tab-members" onclick="switchTab('members')" class="py-2 text-xs font-bold text-center bg-[#2B448C] text-white shadow-sm transition-all">
          명단·출석
        </button>
        <button id="tab-rooms" onclick="switchTab('rooms')" class="py-2 text-xs font-bold text-center text-[#2B448C] hover:bg-white/60 transition-all">
          방배정
        </button>
        <button id="tab-carpool" onclick="switchTab('carpool')" class="py-2 text-xs font-bold text-center text-[#2B448C] hover:bg-white/60 transition-all">
          카풀 현황
        </button>
      </nav>

      <!-- 탭 1: 명단 & 출석 뷰 -->
      <div id="view-members" class="space-y-3">
        <div class="space-y-2">
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-stone-400"></i>
            <input type="text" id="searchInput" oninput="renderMembers()" placeholder="이름, 차량, 방 검색..." 
                   class="w-full bg-white border retro-border pl-8 pr-3 py-1.5 text-xs outline-none focus:border-[#2B448C]" />
          </div>

          <!-- 필터 칩스: 점심O 및 플레이어 중심 카운트로 개편 -->
          <div class="flex flex-wrap gap-1 text-[11px]">
            <button onclick="setFilter('ALL')" class="filter-chip px-2 py-0.5 border retro-border font-bold bg-[#2B448C] text-white" data-filter="ALL">전체</button>
            <button onclick="setFilter('UNCHECKED')" class="filter-chip px-2 py-0.5 border retro-border font-medium bg-white/60 text-[#2B448C]" data-filter="UNCHECKED">미출석</button>
            <button onclick="setFilter('NOPHONE')" class="filter-chip px-2 py-0.5 border retro-border font-medium bg-white/60 text-[#2B448C]" data-filter="NOPHONE">번호없음</button>
            <button onclick="setFilter('LUNCH_O')" id="chip-lunch" class="filter-chip px-2 py-0.5 border retro-border font-medium bg-white/60 text-[#2B448C]" data-filter="LUNCH_O">점심O (19)</button>
            <button onclick="setFilter('PLAYER')" id="chip-player" class="filter-chip px-2 py-0.5 border retro-border font-medium bg-white/60 text-[#2B448C]" data-filter="PLAYER">플레이어 (17)</button>
          </div>
        </div>

        <!-- 인원 리스트 -->
        <div id="membersList" class="space-y-2 max-h-[58vh] overflow-y-auto pr-0.5">
          <div class="text-center py-10 text-xs text-stone-400">데이터를 불러오는 중입니다...</div>
        </div>
      </div>

      <!-- 탭 2: 방배정 뷰 -->
      <div id="view-rooms" class="hidden space-y-3 max-h-[64vh] overflow-y-auto pr-0.5">
        <div class="flex justify-between items-center text-xs pb-1 border-b retro-border">
          <span class="font-bold text-[#2B448C]">실시간 방배정 보드</span>
          <span class="text-[10px] text-stone-400">드롭다운으로 바로 방 이동</span>
        </div>
        <div id="roomsContainer" class="space-y-3"></div>
      </div>

      <!-- 탭 3: 카풀 뷰 -->
      <div id="view-carpool" class="hidden space-y-3 max-h-[64vh] overflow-y-auto pr-0.5">
        <div class="flex justify-between items-center text-xs pb-1 border-b retro-border">
          <span class="font-bold text-[#2B448C]">서울 > 홍천 휴게소 카풀 매칭</span>
          <span class="text-[10px] text-stone-400">차량·차주 실시간 변경 가능</span>
        </div>
        <div id="carpoolContainer" class="space-y-3"></div>
      </div>
    </div>

    <!-- Footer (불필요한 레전드 제거 완료) -->
    <footer class="pt-3 mt-4 border-t retro-border flex justify-between items-center text-[11px] text-[#2B448C]/70">
      <span class="font-mono text-[10px]">WEST ICE HOCKEY CLUB</span>
      <span class="text-[10px] text-stone-400 font-mono">GANGNEUNG MT 2026</span>
    </footer>

  </div>

  <!-- 통합 모달: 연락처 및 특이사항(비고) 동시 수정 -->
  <div id="editModal" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 hidden">
    <div class="w-full max-w-xs bg-[#FAF9F5] p-4 border retro-border shadow-lg space-y-3">
      <div class="flex justify-between items-center border-b retro-border pb-2">
        <span id="editModalTitle" class="text-xs font-bold text-[#2B448C]">정보 수정</span>
        <button onclick="closeEditModal()" class="text-xs text-stone-400 hover:text-black">&times;</button>
      </div>
      <input type="hidden" id="editModalMemberId" />
      
      <div class="space-y-2.5">
        <div>
          <label class="text-[10px] text-stone-500 block mb-1">휴대폰 번호 (- 없이 입력 가능)</label>
          <input type="tel" id="editModalPhone" placeholder="01012345678" 
                 class="w-full bg-white border retro-border p-2 text-xs outline-none focus:border-[#2B448C]" />
        </div>
        <div>
          <label class="text-[10px] text-stone-500 block mb-1">현장 특이사항 / 비고</label>
          <textarea id="editModalNote" rows="3" placeholder="예: 레이저 어택부터 참여, 늦은 합류 등" 
                    class="w-full bg-white border retro-border p-2 text-xs outline-none focus:border-[#2B448C] resize-none"></textarea>
        </div>
      </div>

      <div class="flex gap-2 justify-end pt-1 border-t retro-border">
        <button onclick="closeEditModal()" class="px-3 py-1 text-xs border retro-border bg-stone-100">취소</button>
        <button onclick="saveEditModal()" class="px-3 py-1 text-xs font-bold bg-[#2B448C] text-white">저장</button>
      </div>
    </div>
  </div>

  <!-- 모달: 관리자 메뉴 -->
  <div id="adminModal" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50 hidden">
    <div class="w-full max-w-xs bg-[#FAF9F5] p-4 border retro-border shadow-lg space-y-4">
      <div class="flex justify-between items-center border-b retro-border pb-2">
        <span class="text-xs font-bold text-[#C83E34] flex items-center gap-1">
          <i class="fa-solid fa-shield-halved"></i> 현장 관리자 도구
        </span>
        <button onclick="closeAdminModal()" class="text-xs text-stone-400 hover:text-black">&times;</button>
      </div>
      
      <div class="space-y-2">
        <button onclick="resetAllCheckIn()" class="w-full text-left p-2.5 bg-white border retro-border text-xs text-[#E06D6D] font-bold hover:bg-stone-50 active:scale-[0.99] flex items-center justify-between">
          <span><i class="fa-solid fa-rotate-left mr-1.5"></i> 전체 출석 일괄 초기화</span>
          <i class="fa-solid fa-chevron-right text-[10px] text-stone-400"></i>
        </button>

        <button onclick="openAddMemberPrompt()" class="w-full text-left p-2.5 bg-white border retro-border text-xs text-[#2B448C] font-bold hover:bg-stone-50 active:scale-[0.99] flex items-center justify-between">
          <span><i class="fa-solid fa-user-plus mr-1.5"></i> 현장 신규 인원 추가</span>
          <i class="fa-solid fa-chevron-right text-[10px] text-stone-400"></i>
        </button>
      </div>

      <div class="border-t retro-border pt-2 text-right">
        <button onclick="closeAdminModal()" class="px-3 py-1 text-xs border retro-border bg-stone-100">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Supabase 연동 정보 (코드 내 고정)
    const SUPABASE_URL = 'https://achcypzftdlqqtemmzjz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_vOLa6-n7kiH69Ie-_Af4Iw_hN61dTPb';
    
    let supabaseClient = null;
    let membersData = [];
    let currentFilter = 'ALL';

    const ROOM_OPTIONS = ['ROOM 1 (👃)', 'ROOM 2', 'ROOM 3', 'ROOM 4 (여자)', 'ROOM 5 (여자)', 'X'];
    // 기본 차량 목록 및 동적 생성 지원
let customCars = ['1번 차', '2번 차', '3번 차', '4번 차', '5번 차', '6번 차', '7번 차', '8번 차', '9번 차', '10번 차'];

function getAllCarOptions() {
  const currentAssigned = membersData.map(m => m.carpool_car).filter(c => c && c !== '미배정');
  const all = Array.from(new Set([...customCars, ...currentAssigned]));
  all.sort((a, b) => {
    const numA = parseInt(a.replace(/[^0-9]/g, '')) || 999;
    const numB = parseInt(b.replace(/[^0-9]/g, '')) || 999;
    return numA - numB;
  });
  return [...all, '미배정'];
}

    // 2. 초기화
    function initSupabase() {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      loadMembers();
      setupRealtime();
    }

    // 3. 데이터 로드
    async function loadMembers() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient
        .from('members')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        alert('데이터 로드 실패: ' + error.message);
        return;
      }

      membersData = data || [];
      updateMetrics();
      renderMembers();
      renderRooms();
      renderCarpool();
    }

    // 4. Realtime 리스너 등록
    function setupRealtime() {
      supabaseClient
        .channel('public:members')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, payload => {
          if (payload.eventType === 'UPDATE') {
            const idx = membersData.findIndex(m => m.id === payload.new.id);
            if (idx !== -1) membersData[idx] = payload.new;
          } else if (payload.eventType === 'INSERT') {
            membersData.push(payload.new);
          } else if (payload.eventType === 'DELETE') {
            membersData = membersData.filter(m => m.id !== payload.old.id);
          }
          updateMetrics();
          renderMembers();
          renderRooms();
          renderCarpool();
        })
        .subscribe();
    }

    // 5. 상단 지표 및 필터 칩 숫자 실시간 업데이트
    function updateMetrics() {
      const checkedIn = membersData.filter(m => m.is_checked_in).length;
      const noPhone = membersData.filter(m => !m.phone || m.phone.trim() === '').length;
      const lunchO = membersData.filter(m => m.lunch_yn).length;
      const players = membersData.filter(m => m.game_type === '경기 참여 (플레이어)').length;

      document.getElementById('checkedInCount').innerText = checkedIn;
      document.getElementById('totalCount').innerText = membersData.length;
      document.getElementById('noPhoneCount').innerText = `${noPhone}명 미등록`;

      // 필터 칩 실시간 숫자 갱신
      const lunchBtn = document.getElementById('chip-lunch');
      if (lunchBtn) lunchBtn.innerText = `점심O (${lunchO})`;

      const playerBtn = document.getElementById('chip-player');
      if (playerBtn) playerBtn.innerText = `플레이어 (${players})`;
    }

    // 6. 탭 전환
    function switchTab(tab) {
      ['members', 'rooms', 'carpool'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const view = document.getElementById(`view-${t}`);
        if (t === tab) {
          btn.className = "py-2 text-xs font-bold text-center bg-[#2B448C] text-white shadow-sm transition-all";
          view.classList.remove('hidden');
        } else {
          btn.className = "py-2 text-xs font-bold text-center text-[#2B448C] hover:bg-white/60 transition-all";
          view.classList.add('hidden');
        }
      });
    }

    // 7. 필터 설정
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.className = "filter-chip px-2 py-0.5 border retro-border font-bold bg-[#2B448C] text-white";
        } else {
          btn.className = "filter-chip px-2 py-0.5 border retro-border font-medium bg-white/60 text-[#2B448C]";
        }
      });
      renderMembers();
    }

    // 8. 명단 렌더링
    function renderMembers() {
      const container = document.getElementById('membersList');
      const search = document.getElementById('searchInput').value.trim().toLowerCase();

      let filtered = membersData.filter(m => {
        const matchSearch = m.name.toLowerCase().includes(search) || 
                            (m.carpool_car && m.carpool_car.toLowerCase().includes(search)) ||
                            (m.room_no && m.room_no.toLowerCase().includes(search));
        if (!matchSearch) return false;

        if (currentFilter === 'UNCHECKED') return !m.is_checked_in;
        if (currentFilter === 'NOPHONE') return !m.phone || m.phone.trim() === '';
        if (currentFilter === 'LUNCH_O') return m.lunch_yn;
        if (currentFilter === 'PLAYER') return m.game_type === '경기 참여 (플레이어)';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-stone-400">해당 조건의 인원이 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(m => {
        const isChecked = m.is_checked_in;
        const hasPhone = m.phone && m.phone.trim() !== '';
        const rawPhone = hasPhone ? m.phone.replace(/[^0-9]/g, '') : '';
        const driverBadge = m.is_driver ? '<span class="text-[9px] bg-[#C83E34] text-white px-1 font-mono">차주</span>' : '';

        return `
          <div class="border retro-border ${isChecked ? 'bg-white/80' : 'bg-white/30'} p-3 rounded-none relative">
            <div class="flex items-start justify-between">
              
              <!-- 좌측: 출석 체크 + 프로필 + 점심 토글 + 경기 변경 -->
              <div class="flex items-start gap-2.5">
                <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheckIn(${m.id}, this.checked)" 
                       class="w-4 h-4 mt-1 accent-[#2B448C] cursor-pointer" />
                <div>
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-sm font-bold ${isChecked ? 'line-through text-stone-400' : 'text-[#2B448C]'}">${m.name}</span>
                    ${driverBadge}

                    <!-- 점심 참여 원터치 토글 -->
                    <button onclick="toggleLunch(${m.id}, ${!m.lunch_yn})" 
                            class="text-[9px] font-bold px-1.5 py-0.5 border transition-all ${m.lunch_yn ? 'bg-[#5BAE85] text-white border-[#5BAE85]' : 'bg-[#E06D6D] text-white border-[#E06D6D]'}">
                      점심 ${m.lunch_yn ? 'O' : 'X'}
                    </button>

                    <!-- 경기 참여 상태 선택 -->
                    <select onchange="updateGameType(${m.id}, this.value)" 
                            class="text-[9px] border retro-border font-bold py-0.5 px-1 outline-none ${m.game_type === '경기 미참여' ? 'bg-stone-200 text-stone-600' : 'bg-white text-[#2B448C]'}">
                      <option value="경기 참여 (플레이어)" ${m.game_type === '경기 참여 (플레이어)' ? 'selected' : ''}>플레이어</option>
                      <option value="경기 참여 (골리)" ${m.game_type === '경기 참여 (골리)' ? 'selected' : ''}>골리</option>
                      <option value="경기 미참여" ${m.game_type === '경기 미참여' ? 'selected' : ''}>경기 미참여</option>
                    </select>
                  </div>
                  <div class="text-[10px] font-mono text-[#2B448C]/70 mt-1">
                    ${m.carpool_car || '미배정'} · ${m.room_no}
                  </div>
                </div>
              </div>

              <!-- 우측: 통화 / 통합 수정(연락처+비고) 액션 -->
              <div class="flex items-center gap-1">
                ${hasPhone ? `
                  <a href="tel:${rawPhone}" class="px-2.5 py-1 text-[11px] font-bold bg-[#5BAE85] text-white rounded-none border border-[#5BAE85] flex items-center gap-1 active:scale-95">
                    <i class="fa-solid fa-phone text-[10px]"></i> 통화
                  </a>
                ` : ''}
                <button onclick="openEditModal(${m.id})" 
                        class="px-2 py-1 text-[11px] border retro-border bg-stone-100 text-stone-600 hover:bg-stone-200 active:scale-95 flex items-center justify-center">
                  <i class="fa-solid fa-pen text-[10px]"></i>
                </button>
              </div>
            </div>

            <!-- 하단: 비고가 있는 경우에만 표시 (없으면 구좌 숨김) -->
            ${m.note && m.note.trim() !== '' ? `
              <div class="mt-2 pt-1.5 border-t retro-border flex items-center gap-1.5 text-[10px] text-[#C83E34] font-medium cursor-pointer" onclick="openEditModal(${m.id})">
                <i class="fa-regular fa-note-sticky text-[#2B448C]/60 text-[11px]"></i>
                <span class="truncate">${m.note}</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // 9. 방배정 뷰 렌더링
    function renderRooms() {
      const container = document.getElementById('roomsContainer');
      const grouped = {};
      
      ROOM_OPTIONS.forEach(r => grouped[r] = []);
      membersData.forEach(m => {
        const room = m.room_no || 'X';
        if (!grouped[room]) grouped[room] = [];
        grouped[room].push(m);
      });

      container.innerHTML = ROOM_OPTIONS.map(roomName => {
        const occupants = grouped[roomName] || [];
        return `
          <div class="border retro-border bg-white/40 p-3 rounded-none space-y-2">
            <div class="flex justify-between items-center border-b retro-border pb-1">
              <span class="text-xs font-bold text-[#2B448C]">${roomName}</span>
              <span class="text-[10px] font-mono px-1.5 py-0.2 bg-[#2B448C]/10 text-[#2B448C] border retro-border">
                ${occupants.length}명
              </span>
            </div>
            
            <div class="space-y-1.5">
              ${occupants.length === 0 ? '<div class="text-[11px] text-stone-400 py-1">배정 인원 없음</div>' : ''}
              ${occupants.map(m => `
                <div class="flex justify-between items-center bg-white p-1.5 border retro-border text-xs">
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-[#2B448C]">${m.name}</span>
                    <span class="text-[10px] text-stone-400 font-mono">(${m.gender})</span>${m.is_checked_in ? '<span class="w-1.5 h-1.5 rounded-full bg-[#5BAE85]"></span>' : ''}
                  </div>
                  
                  <select onchange="updateRoom(${m.id}, this.value)" class="text-[11px] bg-[#FAF9F5] border retro-border py-0.5 px-1 font-mono outline-none text-[#2B448C]">
                    ${ROOM_OPTIONS.map(opt => `<option value="${opt}" ${opt === m.room_no ? 'selected' : ''}>${opt}</option>`).join('')}
                  </select>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // 10. 유연한 카풀 뷰 렌더링 (+새 차량 추가 지원)
    function renderCarpool() {
      const container = document.getElementById('carpoolContainer');
      const allCars = getAllCarOptions();
      const grouped = {};

      allCars.forEach(c => grouped[c] = []);
      membersData.forEach(m => {
        let car = m.carpool_car || '미배정';
        if (!grouped[car]) grouped[car] = [];
        grouped[car].push(m);
      });

      // 상단에 신규 차량 추가 버튼 배치
      let html = `
        <div class="flex justify-end pb-1">
          <button onclick="promptAddNewCar()" class="text-[10px] font-bold bg-white border retro-border px-2 py-1 text-[#2B448C] hover:bg-stone-50 active:scale-95">
            <i class="fa-solid fa-plus mr-1"></i> 새 차량/호차 추가
          </button>
        </div>
      `;

      html += allCars.map(carKey => {
        const list = grouped[carKey] || [];
        return `
          <div class="border retro-border bg-white/40 p-3 rounded-none space-y-2">
            <div class="flex justify-between items-center border-b retro-border pb-1">
              <span class="text-xs font-bold text-[#2B448C]"><i class="fa-solid fa-car text-stone-400 mr-1"></i> ${carKey}</span>
              <span class="text-[10px] font-mono text-[#2B448C]">${list.length}명 탑승</span>
            </div>
            
            <div class="space-y-1.5">
              ${list.length === 0 ? '<div class="text-[11px] text-stone-400 py-1">탑승 인원 없음</div>' : ''}
              ${list.map(m => `
                <div class="flex justify-between items-center bg-white p-1.5 border retro-border text-xs">
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold ${m.is_driver ? 'text-[#C83E34]' : 'text-[#2B448C]'}">${m.name}</span>
                    <!-- 차주 여부 토글 버튼 -->
                    <button onclick="toggleDriver(${m.id},${!m.is_driver})" 
                            class="text-[9px] px-1.5 py-0.5 border font-bold transition-all ${m.is_driver ? 'bg-[#C83E34] text-white border-[#C83E34]' : 'bg-stone-100 text-stone-400 border-stone-200'}">
                      차주
                    </button>
                    ${m.is_checked_in ? '<span class="text-[9px] text-[#5BAE85] font-bold">도착</span>' : ''}
                  </div>
                  
                  <!-- 동적 차량 배정 드롭다운 -->
                  <select onchange="updateCarpool(${m.id}, this.value)" class="text-[11px] bg-[#FAF9F5] border retro-border py-0.5 px-1 font-mono outline-none text-[#2B448C]">
                    ${allCars.map(opt => `<option value="${opt}" ${opt === (m.carpool_car || '미배정') ? 'selected' : ''}>${opt}</option>`).join('')}
                  </select>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    // 11. DB 액션 함수들
    async function toggleCheckIn(id, isChecked) {
      const { error } = await supabaseClient
        .from('members')
        .update({ is_checked_in: isChecked, updated_at: new Date().toISOString() })
        .eq('id', id);

      if (error) alert('출석 상태 갱신 실패: ' + error.message);
    }

    async function updateRoom(id, newRoom) {
      const { error } = await supabaseClient
        .from('members')
        .update({ room_no: newRoom, updated_at: new Date().toISOString() })
        .eq('id', id);

      if (error) alert('방배정 변경 실패: ' + error.message);
    }

    async function updateCarpool(id, newCar) {
      const { error } = await supabaseClient
        .from('members')
        .update({ carpool_car: newCar, updated_at: new Date().toISOString() })
        .eq('id', id);

      if (error) alert('카풀 배정 변경 실패: ' + error.message);
    }

    async function toggleDriver(id, newDriverStatus) {
      const { error } = await supabaseClient
        .from('members')
        .update({ is_driver: newDriverStatus, updated_at: new Date().toISOString() })
        .eq('id', id);

      if (error) alert('차주 지정 변경 실패: ' + error.message);
    }

    // 점심 식사 여부 즉시 변경
async function toggleLunch(id, newStatus) {
  const { error } = await supabaseClient
    .from('members')
    .update({ lunch_yn: newStatus, updated_at: new Date().toISOString() })
    .eq('id', id);

  if (error) alert('점심 여부 변경 실패: ' + error.message);
}

// 경기 참여 상태 즉시 변경
async function updateGameType(id, newGameType) {
  const { error } = await supabaseClient
    .from('members')
    .update({ game_type: newGameType, updated_at: new Date().toISOString() })
    .eq('id', id);

  if (error) alert('경기 상태 변경 실패: ' + error.message);
}

// 현장에서 새로운 차량명 생성 (예: 11번 차, 렌트 1호 등)
function promptAddNewCar() {
  const newCar = prompt('추가할 차량명을 입력하세요 (예: 11번 차, 렌트카):');
  if (newCar && newCar.trim()) {
    const trimmed = newCar.trim();
    if (!customCars.includes(trimmed)) {
      customCars.push(trimmed);
      renderCarpool();
      renderMembers();
    }
  }
}

    // 12 & 13. 통합 모달 제어 (연락처 + 비고 동시 저장)
    function openEditModal(id) {
      const member = membersData.find(m => m.id === id);
      if (!member) return;

      document.getElementById('editModalMemberId').value = member.id;
      document.getElementById('editModalTitle').innerText = `${member.name} 님 정보 수정`;
      document.getElementById('editModalPhone').value = member.phone || '';
      document.getElementById('editModalNote').value = member.note || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function saveEditModal() {
      const id = document.getElementById('editModalMemberId').value;
      const phone = document.getElementById('editModalPhone').value.trim();
      const note = document.getElementById('editModalNote').value.trim();

      const { error } = await supabaseClient
        .from('members')
        .update({
          phone: phone || null,
          note: note || null,
          updated_at: new Date().toISOString()
        })
        .eq('id', id);

      if (error) {
        alert('저장 실패: ' + error.message);
      } else {
        closeEditModal();
      }
    }

    // 14. 모달 제어: 관리자 도구
    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
    }
    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    async function resetAllCheckIn() {
      if (!confirm('정말 전체 인원의 출석 상태를 "미출석"으로 초기화하시겠습니까?')) return;
      const { error } = await supabaseClient
        .from('members')
        .update({ is_checked_in: false, updated_at: new Date().toISOString() })
        .neq('id', 0);

      if (error) {
        alert('출석 초기화 실패: ' + error.message);
      } else {
        alert('출석이 모두 초기화되었습니다.');
        closeAdminModal();
      }
    }

    async function openAddMemberPrompt() {
      const name = prompt('추가할 인원의 성함을 입력해주세요:');
      if (!name || !name.trim()) return;
      const gender = prompt('성별을 입력해주세요 (남자 / 여자):', '남자');

      const { error } = await supabaseClient
        .from('members')
        .insert([{
          name: name.trim(),
          gender: gender ? gender.trim() : '남자',
          phone: null,
          game_type: '경기 참여 (플레이어)',
          stay_yn: true,
          room_no: 'ROOM 2',
          laser_yn: true,
          lunch_yn: true,
          carpool_car: '미배정',
          is_driver: false,
          note: null,
          is_checked_in: false
        }]);

      if (error) {
        alert('인원 추가 실패: ' + error.message);
      } else {
        alert(`${name} 님이 추가되었습니다.`);
        closeAdminModal();
      }
    }

    function formatPhone(phone) {
      if (!phone) return '';
      const clean = phone.replace(/[^0-9]/g, '');
      if (clean.length === 11) return clean.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
      if (clean.length === 10) return clean.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
      return phone;
    }

    window.addEventListener('DOMContentLoaded', initSupabase);
  </script>
